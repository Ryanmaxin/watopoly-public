name: Publish Watopoly page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out public files
        uses: actions/checkout@v4
      - name: Prepare the published files
        run: |
          mkdir _site
          cp index.html styles.css Watopoly.png design.pdf uml-final.pdf _site/
          touch _site/.nojekyll
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Upload page
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy page
        id: deployment
        uses: actions/deploy-pages@v4
